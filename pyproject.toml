[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-pipeline"
version = "0.2.0"
description = "Alert-first trading pipeline with Alpaca paper trading support."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.35.0",
    "backtesting>=0.6.0",
    "pandas-ta-classic>=0.5.44",
    "plotly>=5.24.0",
    "streamlit>=1.50.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
trading-pipeline = "trading_pipeline.cli:main"
trading-dashboard = "trading_pipeline.dashboard.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:websockets.legacy is deprecated:DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]
# UP042: keep (str, Enum) - StrEnum changes str()/format() output.
ignore = ["E501", "UP042"]

[tool.ruff.lint.isort]
known-first-party = ["trading_pipeline", "fakes"]
