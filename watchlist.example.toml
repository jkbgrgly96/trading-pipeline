# Copy to watchlist.toml (or point WATCHLIST_PATH / --watchlist at your file).
# Each [[watch]] entry is one strategy instance: symbol + asset class + timeframe.
# With paper orders enabled, a symbol may appear only once (one paper position per symbol).

[defaults]
limit = 250        # bars to fetch; must cover the strategy's min_bars
asset_class = "stock"
strategy = "sma_rsi"  # any entry can override it with its own strategy = "..."
# params = { fast = 10 }   # parameters for entries using the default strategy
# Sizing (defaults from .env): sizing = "risk" | "notional", risk_per_trade,
# max_notional, notional. Any entry can override them.

[[watch]]
symbol = "AAPL"
timeframe = "1Day"

[[watch]]
symbol = "MSFT"
timeframe = "1Day"

[[watch]]
symbol = "BTC/USD"
asset_class = "crypto"
timeframe = "1Hour"
notional = 50
